<html>
  <head>
    <title>Grid Layout Example</title>

    <style>
      form {
        max-width: 400px;
        padding: 1rem;
        border: 1px solid #ccc;
      }

      .form-grid {
        display: grid;
        grid-template-columns: auto 1fr; /* Label column is auto, input column takes remaining space */
        gap: 0.75rem 1rem;
        align-items: center;
      }

      .form-grid label {
        text-align: right;
      }
    </style>
  </head>

  <body>
    <form class="form-grid">
      <label for="city">City:</label>
      <input type="text" id="city" name="city">
    
      <label for="zip">ZIP Code:</label>
      <input type="text" id="zip" name="zip">
    </form>
  </body>
</html>
