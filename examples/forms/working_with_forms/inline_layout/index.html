<html>
  <head>
    <title>Inline Layout Example</title>

    <style>
      .inline-form {
        display: flex;
        gap: 0.5rem;
        align-items: center; /* Vertically center the items */
      }
    </style>
  </head>

  <body>
    <form class="inline-form">
      <label for="search">Search:</label>
      <input type="search" id="search" name="q">
      <button type="submit">Go</button>
    </form>
  </body>
</html>
